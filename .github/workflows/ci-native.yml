name: Flask CI Pipeline

on:
  push:
    branches: [ master ]

jobs:
  ci-native:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python syntax
        run: python -m py_compile $(find . -name "*.py")

      - name: Initialize SQLite database
        run: python manage.py db upgrade

      - name: Smoke test Flask server
        run: |
          nohup python manage.py runserver --host=127.0.0.1 --port=5000 > server.log 2>&1 &
          sleep 5
          curl -f http://127.0.0.1:5000/